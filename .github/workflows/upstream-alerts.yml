name: Upstream alerts

# Opens an `upstream-sync` issue for every commit on algolia/docsearch's main,
# including its releases (scripts/upstreamAlerts.ts).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: Report upstream changes after this ISO date (empty uses the script's default)
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-alerts

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Open issues for new upstream changes
        run: bun scripts/upstreamAlerts.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSIGNEES: tharropoulos
          UPSTREAM_SINCE: ${{ inputs.since }}
